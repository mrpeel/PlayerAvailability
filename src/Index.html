  <style>
    /* Heritage Athletic Design System */
    :root {
      --maroon: #4d0012;
      --gold: #fac218;
      --cream: #fff8f7;
      --white: #ffffff;
      --text: #1a0005;
      --text-muted: #5c4a4e;
      --radius: 12px;
      --shadow: 0 4px 12px rgba(77, 0, 18, 0.1);
      --touch-target: 52px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Hanken Grotesk', sans-serif;
      background-color: var(--cream);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      line-height: 1.5;
    }

    /* Layout Components */
    .header {
      background-color: var(--maroon);
      color: var(--white);
      width: 100%;
      padding: 24px 16px;
      text-align: center;
      position: relative;
      border-bottom: 6px solid var(--gold);
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }

    .logo-container {
      width: 90px;
      height: 90px;
      background: var(--white);
      border-radius: 50%;
      padding: 6px;
      margin: -10px auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid var(--gold);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    
    .logo-container svg {
      width: 85%;
      height: auto;
      display: block;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      text-transform: uppercase;
    }

    .round-indicator {
      display: inline-block;
      background: var(--gold);
      color: var(--maroon);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 800;
      margin-top: 8px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      padding: 24px 16px;
      display: none; /* View management */
    }

    .card {
      background: var(--white);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(77, 0, 18, 0.05);
    }

    /* Form Elements */
    .label {
      font-size: 13px;
      font-weight: 800;
      color: var(--maroon);
      margin-bottom: 8px;
      display: block;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .input-field {
      width: 100%;
      min-height: 56px;
      border: 2px solid #e0d5d7;
      border-radius: var(--radius);
      padding: 12px 16px;
      font-size: 18px;
      margin-bottom: 20px;
      font-family: inherit;
      transition: border-color 0.2s;
    }

    .input-field:focus {
      outline: none;
      border-color: var(--maroon);
    }

    /* Buttons */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: var(--touch-target);
      padding: 12px 24px;
      border-radius: var(--radius);
      font-weight: 800;
      font-size: 16px;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      width: 100%;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-primary {
      background-color: var(--maroon);
      color: var(--white);
    }

    .btn-primary:active {
      transform: translateY(2px);
      filter: brightness(1.2);
    }

    .btn-outline {
      background-color: transparent;
      border: 2px solid var(--maroon);
      color: var(--maroon);
    }

    .btn-outline.selected {
      background: var(--maroon);
      color: white;
    }
    
    .btn-selected-available {
      background-color: var(--gold);
      color: var(--maroon);
      border: 3px solid var(--gold);
    }

    .btn-selected-unavailable {
      background-color: var(--maroon);
      color: var(--white);
      border: 2px solid var(--maroon);
    }

    .btn-gold {
      background-color: var(--gold);
      color: var(--maroon);
    }

    /* Player Specifics */
    .player-card h2 {
      font-size: 24px;
      font-weight: 800;
      color: var(--maroon);
    }

    .status-tag {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .status-active { background: #dcfce7; color: #166534; }
    .status-injured { background: #fee2e2; color: #991b1b; }
    .status-away { background: #f1f5f9; color: #475569; }

    .response-group {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-top: 20px;
    }

    /* Utilities */
    .loader {
      border: 5px solid rgba(77, 0, 18, 0.1);
      border-top: 5px solid var(--maroon);
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
      margin: 40px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .reset-link {
      color: var(--maroon);
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      margin-top: 32px;
      text-align: center;
      display: block;
      opacity: 0.7;
    }

    .success-pill {
      background: #166534;
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 800;
      display: none;
      animation: fadeIn 0.3s forwards;
    }

    @keyframes fadeIn { from { opacity:0; transform: scale(0.9); } to { opacity:1; transform: scale(1); } }
  </style>
</head>

    <h1>Laburnum CC Availability</h1>
    <div id="round-indicator-container" class="round-indicator" style="display:none">
      ROUND <span id="header-round"></span>
    </div>
    <div id="version-tag" style="font-size: 10px; opacity: 0.5; margin-top: 10px; font-weight: 800;">v2.5</div>
    
    <!-- Info about GAS Banner -->
    <div style="margin-top: 15px; font-size: 11px; opacity: 0.7; max-width: 250px; margin-left: auto; margin-right: auto; line-height: 1.2;">
      Note: The blue banner at top is a Google security requirement. You can click 'X' to hide it.
    </div>
  </div>

  <!-- Loading View -->
  <div id="loading-view" class="container" style="display: block;">
    <div class="loader"></div>
    <p style="text-align: center; font-weight: 600; color: var(--maroon);">Preparing the pitch...</p>
  </div>

  <!-- Login View -->
  <div id="login-view" class="container">
    <div class="card">
      <h2 style="margin-bottom: 8px; font-weight: 800;">Welcome</h2>
      <p style="color: var(--text-muted); margin-bottom: 24px; font-size: 15px;">Sign in with your phone number to manage your availability.</p>
      
      <label class="label">Mobile Number</label>
      <input type="tel" id="phone-input" class="input-field" placeholder="0400 000 000" onkeypress="if(event.key === 'Enter') handleLogin()">
      
      <button class="btn btn-primary" onclick="handleLogin()">Sign In</button>
    </div>
  </div>

  <!-- Error View -->
  <div id="error-view" class="container">
    <div class="card" style="border-top: 5px solid #991b1b;">
      <h2 style="color: #991b1b; margin-bottom: 12px;">System Error</h2>
      <p id="error-msg" style="margin-bottom: 24px; font-family: monospace; font-size: 13px; background: #fef2f2; padding: 12px; border-radius: 8px;"></p>
      <button class="btn btn-primary" onclick="loadData()">Try Again</button>
      <button class="btn btn-outline" style="margin-top: 12px;" onclick="runDiagnostics()">Run Diagnostics</button>
      <button class="btn btn-outline" style="margin-top: 12px; border-color: #991b1b; color: #991b1b;" onclick="hardReset()">Clear Data & Reset App</button>
      <div id="diag-results" style="margin-top: 20px; font-size: 12px; display: none; background: #f8fafc; padding: 12px; border-radius: 8px; white-space: pre-wrap;"></div>
    </div>
  </div>

  <!-- Dashboard View -->
  <div id="dashboard-view" class="container">
    <div id="round-info-card" class="card" style="background: var(--maroon); color: white; border: none;">
      <h3 id="round-title" style="text-transform: uppercase; letter-spacing: 1px;">ROUND</h3>
      <p id="round-dates" style="opacity: 0.9; font-size: 15px; font-weight: 600;"></p>
      <p id="round-date" style="opacity: 0.9; font-size: 15px; font-weight: 600;"></p>
    </div>

    <div id="players-list">
      <!-- Player cards injected here -->
    </div>

    <div class="reset-link" onclick="handleReset()">Not your account? Logout</div>
  </div>

  <script>
    const APP_VERSION = "2.4";
    const ROUND_NUM_FROM_URL = "<?= roundNum ?>";
    let state = {
      phone: localStorage.getItem('lcc_phone'),
      players: [],
      roundInfo: null,
      availability: {}
    };

    function debugLog(msg) {
      console.log(`[CLIENT] ${msg}`);
      const diag = document.getElementById('diag-results');
      if (diag) diag.innerText += `\n> ${msg}`;
    }

    window.onload = () => {
      document.getElementById('version-tag').innerText = "v" + APP_VERSION;
      debugLog(`App starting. Phone: ${state.phone}`);
      if (state.phone && state.phone !== 'null') {
        loadData();
      } else {
        showView('login-view');
      }
    };

    /**
     * Normalizes phone number to E164 format for client-side matching/saving
     */
    function normalizePhone(phone) {
      if (!phone) return "";
      let clean = String(phone).replace(/[^\d]/g, '');
      if (clean.startsWith('04') && clean.length === 10) {
        clean = '61' + clean.slice(1);
      } else if (clean.length === 9 && clean.startsWith('4')) {
        clean = '61' + clean;
      }
      return '+' + clean;
    }

    function showView(viewId) {
      document.querySelectorAll('.container').forEach(c => c.style.display = 'none');
      document.getElementById(viewId).style.display = 'block';
    }

    function handleLogin() {
      const input = document.getElementById('phone-input').value.trim();
      if (!input) return alert('Please enter your mobile number');
      
      const phone = normalizePhone(input);
      state.phone = phone;
      localStorage.setItem('lcc_phone', phone);
      loadData();
    }

    function handleReset() {
      localStorage.removeItem('lcc_phone');
      state.phone = null;
      showView('login-view');
      document.getElementById('round-indicator-container').style.display = 'none';
    }

    function loadData() {
      debugLog("Loading data from server...");
      showView('loading-view');
      document.getElementById('diag-results').style.display = 'none';
      document.getElementById('diag-results').innerText = "";
      
      google.script.run
        .withSuccessHandler(onDataLoaded)
        .withFailureHandler(err => {
          debugLog(`GAS Failure: ${err.message}`);
          document.getElementById('error-msg').innerText = "CONNECTION ERROR: " + (err.message || err);
          showView('error-view');
        })
        .getInitialData(state.phone, ROUND_NUM_FROM_URL);
    }

    function runDiagnostics() {
      const diagDiv = document.getElementById('diag-results');
      diagDiv.style.display = 'block';
      debugLog("Requesting server diagnostics...");
      
      google.script.run
        .withSuccessHandler(results => {
          debugLog("Diagnostics received.");
          diagDiv.innerHTML += `
            <br>--- SERVER REPORT ---
            <strong>Version:</strong> ${results.version}
            <strong>SS Linked:</strong> ${results.spreadsheetLinked ? '✅' : '❌'}
            <strong>Tabs:</strong> ${results.tabsFound.join(', ') || 'None'}
            ${results.errors && results.errors.length ? `<span style="color:red">Errors: ${results.errors.join('<br>')}</span>` : ''}
          `;
        })
        .withFailureHandler(err => {
          debugLog(`Diagnostics failed: ${err.message}`);
        })
        .runDiagnostics();
    }

    function hardReset() {
      localStorage.clear();
      window.location.reload();
    }

    function onDataLoaded(data) {
      debugLog("Server response received.");
      if (!data) {
        debugLog("Error: Received null/empty response from server.");
        document.getElementById('error-msg').innerText = "Received empty response from server.";
        showView('error-view');
        return;
      }
      
      if (data.error) {
        debugLog(`Server returned error: ${data.error}`);
        if (data.error.toLowerCase().includes('phone') || data.error.toLowerCase().includes('no players')) {
          alert(data.error);
          handleReset();
        } else {
          document.getElementById('error-msg').innerText = data.error;
          showView('error-view');
        }
        return;
      }

      state.players = data.players;
      state.roundInfo = data.roundInfo;
      state.availability = data.availability;

      renderDashboard();
      showView('dashboard-view');
    }

    function renderDashboard() {
      try {
        debugLog("Rendering dashboard...");
        if (!state.roundInfo) throw new Error("Round information is missing.");
        
        const date1 = state.roundInfo.Date1 ? new Date(state.roundInfo.Date1).toLocaleDateString('en-AU', {day:'numeric', month:'short'}) : '';
        const date2 = state.roundInfo.Date2 ? new Date(state.roundInfo.Date2).toLocaleDateString('en-AU', {day:'numeric', month:'short'}) : '';
        const dateStr = date2 ? `${date1} & ${date2}` : date1;

        document.getElementById('round-indicator-container').style.display = 'inline-block';
        document.getElementById('header-round').innerText = state.roundInfo.RoundNum || "?";
        document.getElementById('round-title').innerText = `Round ${state.roundInfo.RoundNum || "?"} - ${dateStr}`;
        document.getElementById('round-date').innerText = state.roundInfo.Format || "Unknown";

      const list = document.getElementById('players-list');
      list.innerHTML = '';

      state.players.forEach(player => {
        const currentAvail = state.availability[player.ID];
        const card = document.createElement('div');
        card.className = 'card player-card';
        
        let injuryToggle = '';
        if (player.GlobalStatus === 'Injured') {
          injuryToggle = `
            <div style="margin: 16px 0; padding: 16px; background: #fffbeb; border-radius: 8px; border: 1px solid var(--gold);">
              <p style="font-size: 14px; font-weight:600; color: #92400e; margin-bottom: 12px;">You are currently listed as Injured.</p>
              <button class="btn btn-gold" style="min-height: 40px; font-size: 13px;" onclick="handleActivate('${player.ID}', this)">Mark as Active</button>
            </div>
          `;
        }

        const options = getOptionsForFormat(state.roundInfo.Format, player.ID, currentAvail);

        card.innerHTML = `
          <div style="display: flex; justify-content: space-between; align-items: flex-start;">
            <div>
              <h2>${player.Name}</h2>
              <span class="status-tag status-${player.GlobalStatus.toLowerCase()}">${player.GlobalStatus}</span>
            </div>
            <div id="status-icon-${player.ID}">
               ${currentAvail ? '<span style="color: #166534; font-size: 28px;">✓</span>' : ''}
            </div>
          </div>
          ${injuryToggle}
          <div class="response-group">
            <label class="label">Availability Response</label>
            ${options}
          </div>
          <div style="text-align: center; margin-top: 12px;">
            <span id="msg-${player.ID}" class="success-pill">✓ RESPONSE SAVED</span>
          </div>
        `;
        list.appendChild(card);
      });
      } catch (e) {
        debugLog(`Render Crash: ${e.message}`);
        document.getElementById('error-msg').innerText = "RENDER ERROR: " + e.message;
        showView('error-view');
      }
    }

    function getOptionsForFormat(format, playerId, current) {
      let opts = [];
      if (format === '1-Day') {
        opts = ['Available', 'Unavailable'];
      } else {
        opts = ['Both Days', 'Day 1 Only', 'Day 2 Only', 'Unavailable'];
      }

      return opts.map(opt => {
        const isSelected = current === opt;
        let btnClass = 'btn-outline';
        if (isSelected) {
          btnClass = opt.toLowerCase().includes('unavailable') ? 'btn-selected-unavailable' : 'btn-selected-available';
        }
        
        return `<button class="btn ${btnClass}" 
                 onclick="submitResponse('${playerId}', '${opt}', this)"
                 data-player="${playerId}" data-opt="${opt}">
                 ${opt}
                </button>`;
      }).join('');
    }

    function submitResponse(playerId, response, btn) {
      // Optimistic UI update
      const buttons = document.querySelectorAll(`button[data-player="${playerId}"]`);
      buttons.forEach(b => {
        const opt = b.getAttribute('data-opt');
        let btnClass = 'btn-outline';
        if (opt === response) {
          btnClass = opt.toLowerCase().includes('unavailable') ? 'btn-selected-unavailable' : 'btn-selected-available';
        }
        b.className = 'btn ' + btnClass;
      });

      google.script.run
        .withSuccessHandler(() => {
          const pill = document.getElementById(`msg-${playerId}`);
          pill.style.display = 'inline-block';
          document.getElementById(`status-icon-${playerId}`).innerHTML = '<span style="color: #166534; font-size: 28px;">✓</span>';
          setTimeout(() => pill.style.display = 'none', 4000);
        })
        .saveAvailability(playerId, state.roundInfo.RoundNum, response);
    }

    function handleActivate(playerId, btn) {
      btn.innerText = "Updating...";
      btn.disabled = true;
      google.script.run
        .withSuccessHandler(() => {
          loadData(); // Full reload to refresh status
        })
        .setPlayerActive(playerId);
    }
  </script>
</body>
</html>
