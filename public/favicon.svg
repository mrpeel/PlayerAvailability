<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a0016"/>
      <stop offset="100%" stop-color="#3b000d"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed65b"/>
      <stop offset="50%" stop-color="#fac218"/>
      <stop offset="100%" stop-color="#d49b06"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Rounded Container / Shield -->
  <g filter="url(#dropShadow)">
    <!-- Outer Shield Boundary -->
    <path d="M256 32 C380 32 448 68 448 180 C448 330 330 435 256 476 C182 435 64 330 64 180 C64 68 132 32 256 32 Z"
          fill="url(#shieldBg)" stroke="url(#goldGrad)" stroke-width="16" stroke-linejoin="round"/>
    
    <!-- Inner Gold Shield Accent -->
    <path d="M256 60 C360 60 420 90 420 185 C420 310 320 398 256 436 C192 398 92 310 92 185 C92 90 152 60 256 60 Z"
          fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.6"/>
  </g>

  <!-- Crossed Cricket Bats (Gold & White Highlights) -->
  <g transform="translate(256,220)">
    <!-- Bat 1 (Backslash direction) -->
    <g transform="rotate(45)">
      <!-- Handle -->
      <rect x="-8" y="-120" width="16" height="50" rx="4" fill="#ffffff" stroke="#fac218" stroke-width="2"/>
      <line x1="-8" y1="-105" x2="8" y2="-105" stroke="#4d0012" stroke-width="2"/>
      <line x1="-8" y1="-90" x2="8" y2="-90" stroke="#4d0012" stroke-width="2"/>
      <!-- Blade -->
      <path d="M-14 -70 L14 -70 L12 80 C12 90 -12 90 -12 80 Z" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="2"/>
      <line x1="0" y1="-65" x2="0" y2="75" stroke="#d49b06" stroke-width="3"/>
    </g>

    <!-- Bat 2 (Slash direction) -->
    <g transform="rotate(-45)">
      <!-- Handle -->
      <rect x="-8" y="-120" width="16" height="50" rx="4" fill="#ffffff" stroke="#fac218" stroke-width="2"/>
      <line x1="-8" y1="-105" x2="8" y2="-105" stroke="#4d0012" stroke-width="2"/>
      <line x1="-8" y1="-90" x2="8" y2="-90" stroke="#4d0012" stroke-width="2"/>
      <!-- Blade -->
      <path d="M-14 -70 L14 -70 L12 80 C12 90 -12 90 -12 80 Z" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="2"/>
      <line x1="0" y1="-65" x2="0" y2="75" stroke="#d49b06" stroke-width="3"/>
    </g>

    <!-- Cricket Ball in the Intersection -->
    <circle cx="0" cy="0" r="32" fill="#d90429" stroke="#ffffff" stroke-width="4"/>
    <!-- Cricket Ball Seam -->
    <path d="M-22 -22 C-5 -5 5 5 22 22" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="4,3"/>
    <path d="M-20 -24 C-3 -7 7 3 24 20" fill="none" stroke="rgba(0,0,0,0.25)" stroke-width="2"/>
  </g>

  <!-- LCC Monogram at Base of Shield -->
  <text x="256" y="375" text-anchor="middle" font-family="'Hanken Grotesk', 'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="52" fill="#ffffff" letter-spacing="6">LCC</text>
</svg>
